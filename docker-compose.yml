version: '3'
services:
  backend:
    build: ./backend
    container_name: aniay-backend
    ports:
      - "8001:8001"
    networks:
      - aniay-net

  frontend:
    build: ./frontend
    container_name: aniay-frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend
    networks:
      - aniay-net

networks:
  aniay-net:
    driver: bridge

